<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration | Campus Hire</title>

    <link rel="stylesheet" href="student_registration.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Student Registration</h1>
            <p>Create your Campus Hire profile</p>

            <form id="studentForm">

                <label>Full Name</label>
                <input type="text" id="name" required>

                <label>Email</label>
                <input type="email" id="email" required>

                <label>Phone Number</label>
                <input type="tel" id="phone" required>

                <label>Branch</label>

                <select id="branch" required>
                    <option value="">Select Branch</option>
                    <option>CSE</option>
                    <option>IT</option>
                    <option>AIML</option>
                    <option>ECE</option>
                    <option>ME</option>
                    <option>Civil</option>
                </select>

                <label>CGPA</label>
                <input type="number"
                       id="cgpa"
                       min="0"
                       max="10"
                       step="0.01"
                       required>

                <label>Skills</label>

                <div class="skills">

                    <label><input type="checkbox" value="C++"> C++</label>
                    <label><input type="checkbox" value="Java"> Java</label>
                    <label><input type="checkbox" value="Python"> Python</label>
                    <label><input type="checkbox" value="SQL"> SQL</label>
                    <label><input type="checkbox" value="HTML"> HTML</label>
                    <label><input type="checkbox" value="CSS"> CSS</label>
                    <label><input type="checkbox" value="JavaScript"> JavaScript</label>
                    <label><input type="checkbox" value="React"> React</label>

                </div>

                <label>Resume</label>
                <input type="file" id="resume">

                <button type="submit">
                    Create Profile
                </button>

            </form>

        </div>

    </div>

    <script src="student_registration.js"></script>

</body>
</html>

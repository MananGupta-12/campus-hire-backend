<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Vacancy | Campus Hire</title>

    <link rel="stylesheet"
          href="create_vacancy.css">

</head>

<body>

    <div class="dashboard">

        <!-- Sidebar -->

        <div class="sidebar">

            <h2>Campus Hire</h2>

            <ul>

                <li>
                    <a href="recruiter_dashboard.html">
                        Dashboard
                    </a>
                </li>

                <li>
                    <a href="create_vacancy.html">
                        Create Vacancy
                    </a>
                </li>

                <li>
                    <a href="view_applicants.html">
                        View Applicants
                    </a>
                </li>

            </ul>

        </div>

        <!-- Main Content -->

        <div class="main-content">

            <div class="card">

                <h1>Create New Vacancy</h1>

                <form id="jobForm">

                    <label>Job Title</label>

                    <input type="text"
                           id="jobTitle"
                           required>

                    <label>Location</label>

                    <input type="text"
                           id="location"
                           required>

                    <label>Package (LPA)</label>

                    <input type="number"
                           id="package"
                           required>

                    <label>Minimum CGPA</label>

                    <input type="number"
                           id="cgpa"
                           min="0"
                           max="10"
                           step="0.1"
                           required>

                    <label>Required Skills</label>

                    <div class="skills">

                        <label>
                            <input type="checkbox"
                                   value="C++">
                            C++
                        </label>

                        <label>
                            <input type="checkbox"
                                   value="Java">
                            Java
                        </label>

                        <label>
                            <input type="checkbox"
                                   value="Python">
                            Python
                        </label>

                        <label>
                            <input type="checkbox"
                                   value="SQL">
                            SQL
                        </label>

                        <label>
                            <input type="checkbox"
                                   value="HTML">
                            HTML
                        </label>

                        <label>
                            <input type="checkbox"
                                   value="CSS">
                            CSS
                        </label>

                        <label>
                            <input type="checkbox"
                                   value="JavaScript">
                            JavaScript
                        </label>

                        <label>
                            <input type="checkbox"
                                   value="React">
                            React
                        </label>

                    </div>

                    <label>Add other Skills</label>

<div class="custom-skill-box">

    <input
        type="text"
        id="customSkill"
        placeholder="Example: Docker">

    <button
        type="button"
        onclick="addSkill()">

        Add Skill

    </button>

</div>

<div id="customSkillsList">

</div>

                    <label>Application Deadline</label>

                    <input type="date"
                           id="deadline"
                           required>

                    <button type="submit">

                        Create Job

                    </button>

                </form>

            </div>

        </div>

    </div>

    <script src="create_vacancy.js"></script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Recruiter Registration | Campus Hire</title>

    <link rel="stylesheet"
          href="recruiter_registration.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Recruiter Registration</h1>

            <p>
                Create your company profile
            </p>

            <form id="recruiterForm">

                <label>Company Name</label>

                <input type="text"
                       id="companyName"
                       required>

                <label>Email</label>

                <input type="email"
                       id="email"
                       required>

                <label>Phone Number</label>

                <input type="tel"
                       id="phone"
                       required>

                <label>Location</label>

                <input type="text"
                       id="location"
                       required>

                <button type="submit">

                    Register Company

                </button>

            </form>

        </div>

    </div>

    <script src="recruiter_registration.js"></script>

</body>

</html>

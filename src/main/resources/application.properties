# 1. Database Connection 
# Looks for Render Environment Variables first, falls back to localhost for your laptop
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/campus_hire}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}

# 2. Force the MySQL Driver & Dialect (This permanently fixes the Clever Cloud crash)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# 3. Automatically create and update database tables
spring.jpa.hibernate.ddl-auto=update